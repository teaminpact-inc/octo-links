<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octo</title>
  <style>
    :root { --bg: #f6f3fc; --card: #fff; --text: #2b2640; --muted: #6f6a82; --primary: #7b61d9; --on-primary: #fff; --sub: #ece6fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1a26; --card: #262333; --text: #f1eefa; --muted: #a9a3bd; --primary: #9a84ec; --on-primary: #17141f; --sub: #34304a; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
    main { text-align: center; padding: 28px 20px; margin: 16px; max-width: 360px; width: calc(100% - 32px); box-sizing: border-box; background: var(--card); border-radius: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    .hint { font-size: 13px; margin: 14px 0 0; }
    code { background: var(--sub); padding: 2px 6px; border-radius: 4px; }
    a.btn { display: block; padding: 14px; margin-top: 10px; border-radius: 12px; background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 600; }
    a.btn.sub { background: var(--sub); color: var(--text); }
  </style>
</head>
<body>
  <main id="app">
    <h1>Page not found</h1>
    <p>Please check the address.</p>
  </main>
  <script>
    var APP_STORE_URL = "https://apps.apple.com/app/id6831534621";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.teaminpact.octopus";
    var PACKAGE = "com.teaminpact.octopus";

    var ko = /^ko\b/i.test(navigator.language || "");
    var T = ko ? {
      invite: { title: "초대를 받았어요", body: "옥토 앱에서 친구 신청을 이어가요.", label: "초대 코드" },
      code: { title: "옥토 친구 추가", body: "옥토 앱에서 이 코드로 연결 요청을 보낼 수 있어요.", label: "옥토 코드" },
      open: "앱에서 열기",
      install: "앱 설치하기",
      hint: "앱을 설치했다면 ‘앱에서 열기’를 누르세요. 처음 설치했다면 설치 후 다시 열어 주세요.",
      notFound: "페이지를 찾을 수 없어요", check: "주소를 다시 확인해 주세요."
    } : {
      invite: { title: "You're invited", body: "Continue the friend request in the Octo app.", label: "Invite code" },
      code: { title: "Add a friend on Octo", body: "Send a link request with this code in the Octo app.", label: "Octo code" },
      open: "Open in app",
      install: "Get the app",
      hint: "Already have Octo? Tap ‘Open in app’. Just installed it? Open this again after installing.",
      notFound: "Page not found", check: "Please check the address."
    };

    var ua = navigator.userAgent;
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    // 카카오톡 · 인스타그램 · 네이버 같은 앱 안 브라우저는 유니버설 링크/앱 링크로 앱을 열지 않는다.
    var inAppBrowser = /KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER|DaumApps|everytimeApp|Whale\/.*Mobile|SamsungBrowser\/.*CrossApp/i.test(ua);

    // /i/<token>: 초대 링크(열면 바로 연결) · /c/<code>: 옥토 코드 QR(연결 요청)
    var m = location.pathname.match(/^\/(i|c)\/([^\/?#]+)/);
    if (!m) {
      document.title = T.notFound;
      document.getElementById("app").innerHTML = "<h1></h1><p></p>";
      document.querySelector("h1").textContent = T.notFound;
      document.querySelector("p").textContent = T.check;
    } else {
      var kind = m[1];
      var raw = m[2];
      var token = encodeURIComponent(decodeURIComponent(raw));
      var shown = decodeURIComponent(raw);
      if (kind === "c" && /^[0-9A-Za-z]{8}$/.test(shown)) shown = shown.toUpperCase().slice(0, 4) + "-" + shown.toUpperCase().slice(4);
      var copy = kind === "c" ? T.code : T.invite;
      // 앱의 routeForLink: octopus://i/<token> → /i/<token>, octopus://c/<code> → 코드가 채워진 연결 화면
      var schemeUrl = "octopus://" + kind + "/" + token;
      var playUrl = PLAY_STORE_URL + "&referrer=" + encodeURIComponent((kind === "c" ? "code=" : "invite=") + token);
      var intentUrl = "intent://" + kind + "/" + token + "#Intent;scheme=octopus;package=" + PACKAGE +
        ";S.browser_fallback_url=" + encodeURIComponent(playUrl) + ";end";
      var openUrl = isAndroid ? intentUrl : schemeUrl;
      var storeUrl = isAndroid ? playUrl : APP_STORE_URL;

      document.title = copy.title;
      document.getElementById("app").innerHTML =
        '<h1 id="t"></h1><p id="b"></p>' +
        '<a class="btn" id="open"></a>' +
        '<a class="btn sub" id="install"></a>' +
        '<p class="hint" id="h"></p>' +
        '<p class="hint"><span id="cl"></span> <code id="c"></code></p>';
      document.getElementById("t").textContent = copy.title;
      document.getElementById("b").textContent = copy.body;
      document.getElementById("h").textContent = T.hint;
      document.getElementById("cl").textContent = copy.label;
      document.getElementById("c").textContent = shown;
      var open = document.getElementById("open");
      open.textContent = T.open;
      open.href = openUrl;
      var install = document.getElementById("install");
      install.textContent = T.install;
      install.href = storeUrl;

      // 앱이 설치돼 있으면 버튼을 누르지 않아도 바로 열리게 한 번 시도한다.
      // iOS Safari는 앱이 없을 때 오류 창을 띄우므로 앱 안 브라우저에서만 자동 시도한다
      // (Safari에서 앱이 있으면 유니버설 링크가 이미 앱을 열었다).
      if (isAndroid || (isIOS && inAppBrowser)) {
        setTimeout(function () { location.href = openUrl; }, 50);
      }
    }
  </script>
</body>
</html>
