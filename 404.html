<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>초대 링크</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fafafa; color: #222; }
    main { text-align: center; padding: 24px; max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #666; margin: 0 0 20px; line-height: 1.5; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
    a.btn { display: block; padding: 14px; margin-top: 10px; border-radius: 10px; background: #222; color: #fff; text-decoration: none; }
    a.btn.sub { background: #e9e9e9; color: #222; }
  </style>
</head>
<body>
  <main id="app">
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소를 다시 확인해 주세요.</p>
  </main>
  <script>
    var APP_STORE_URL = "https://apps.apple.com/app/id6831534621";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.teaminpact.octopus";

    var m = location.pathname.match(/^\/i\/([^\/?#]+)/);
    if (m) {
      var code = decodeURIComponent(m[1]);
      var ua = navigator.userAgent;
      var store = /android/i.test(ua) ? PLAY_STORE_URL : APP_STORE_URL;
      document.title = "초대 링크";
      document.getElementById("app").innerHTML =
        '<h1>초대를 받았어요</h1>' +
        '<p>앱이 설치되어 있다면 이 링크를 누르면 바로 열려요.<br>앱이 없다면 먼저 설치해 주세요.</p>' +
        '<p>초대 코드 <code></code></p>' +
        '<a class="btn" href="' + store + '">앱 설치하기</a>';
      document.querySelector("code").textContent = code;
    }
  </script>
</body>
</html>
